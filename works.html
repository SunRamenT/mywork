    <style>
        /* ← これが余白対策の最重要 */
        html, body {
            margin: 0;
            padding: 0;
        }

        /* 背景レイヤーの押し下げ防止 */
        #bg, #overlay {
            position: fixed;
            top: 0;
            left: 0;
        }

        #wrapper {
            align-items: flex-start;
            padding-top: 0 !important;
        }

        #main {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            align-self: flex-start;
            padding-top: 0 !important;
            margin-top: 0 !important;
        }

        /* コンテンツ調整 */
        .works-container {
            max-width: 900px;
            margin: 2em auto;
            padding: 0 2em;
            text-align: center;
        }

        h1 {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 40px;
            text-align: left;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            margin: 20px 0;
            border-radius: 8px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 50px;
        }
        .grid-item {
            flex: 1;
            min-width: 0;
        }
        .grid-item h2 {
            text-align: center;
            font-size: 1.1em;
            margin-top: 0;
        }

        @media screen and (max-width: 768px) {
            .grid-container {
                flex-direction: column;
            }
        }

        a.back-link {
            display: inline-block;
            margin-top: 50px;
            margin-bottom: 30px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a.back-link:hover {
            background-color: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
