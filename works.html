<!DOCTYPE HTML>
<html>
<head>
    <title>My Works - Taiyo Hirayama</title>
    <meta charset="utf--8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    
    <style>
        /* 基本レイアウト */
        #main {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .works-container {
            max-width: 900px; /* 少し幅を広げて3列表示に対応 */
            margin: 3em auto;
            padding: 0 2em;
            text-align: center;
        }

        /* 見出しスタイル */
        h1 {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 40px;
            text-align: left;
        }

        /* 動画ラッパー */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            margin: 20px 0;
            border-radius: 8px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ===== ↓ここから新しいレイアウト用のCSS↓ ===== */
        
        /* 3つの動画を横に並べるためのコンテナ */
        .grid-container {
            display: flex;
            justify-content: space-between; /* 要素間のスペースを均等に配置 */
            gap: 20px; /* 各動画の間の隙間 */
            margin-top: 50px;
        }

        /* 横並びにする各動画のアイテム */
        .grid-item {
            flex: 1; /* 親要素の幅に応じて均等に幅を調整 */
            min-width: 0; /* flexアイテムの縮小問題を回避 */
        }

        /* 横並びの動画のタイトルは中央揃えに */
        .grid-item h2 {
            text-align: center;
            font-size: 1.1em; /* 少しフォントサイズを調整 */
            margin-top: 0;
        }

        /* スマートフォン用の設定 (画面幅が768px以下の場合) */
        @media screen and (max-width: 768px) {
            .grid-container {
                flex-direction: column; /* 横並びを解除して縦に並べる */
            }
        }

        /* ===== ↑ここまで新しいレイアウト用のCSS↑ ===== */

        /* 「戻る」リンクのスタイル */
        a.back-link {
            display: inline-block;
            margin-top: 50px;
            margin-bottom: 30px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a.back-link:hover {
            background-color: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
<body class="is-preload">

    <div id="wrapper">
        <div id="bg"></div>
        <div id="overlay"></div>
        <div id="main">

            <div class="works-container">
                <h1>制作物 (Works)</h1>

                <h2>3DGAME: NOT LIVING(制作中)</h2>
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/1Nnmz9CssFU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="grid-container">
                    
                    <div class="grid-item">
                        <h2>2DGAME: NOT LIVING(リメイク前)</h2>
                        <div class="video-wrapper">
                            <iframe width="560" height="315" src="https://www.youtube.com/embed/VkCh6uL4mBs" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>

                    <div class="grid-item">
                        <h2>c++による直感操作のRPG風バトル</h2>
                        <div class="video-wrapper">
                            <iframe width="560" height="315" src="https://www.youtube.com/embed/H92AXY4sJPc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>
                    
                    <div class="grid-item">
                        <h2>pythonの株価予測アプリ</h2>
                        <div class="video-wrapper">
                            <iframe width="560" height="315" src="https://www.youtube.com/embed/L09rMfIWqDc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>

                </div>

                <a href="index.html" class="back-link">トップページに戻る</a>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() { document.body.classList.remove('is-preload'); }
    </script>
</body>
</html>
