    <style>
        #wrapper {
            align-items: flex-start;
        }

        #main {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            align-self: flex-start;
            width: 100%;
        }

        .works-container {
            max-width: 900px;
            margin: 5em auto 3em auto;
            padding: 0 2em;
            text-align: center;
        }

        h1 {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 40px;
            text-align: left;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            margin: 20px 0;
            border-radius: 8px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== ↓ここから2列表示用のCSSに変更↓ ===== */
        .grid-container {
            display: flex;
            justify-content: space-between; /* 両端に寄せる */
            gap: 20px;
            margin-top: 50px;
        }
        .grid-item {
            /* 2列で均等に並ぶように幅を計算 */
            flex: 0 0 calc(50% - 10px); /* 100%/2 - (gap/2) */
        }
        .grid-item h2 {
            text-align: center;
            font-size: 1.1em;
            margin-top: 0;
        }

        /* スマートフォン用の設定 (画面幅が768px以下の場合) */
        @media screen and (max-width: 768px) {
            .grid-container {
                flex-direction: column; /* 縦に並べる */
                gap: 0;
            }
            .grid-item {
                flex: 0 0 100%; /* 全幅を使用 */
                margin-bottom: 40px;
            }
        }
        /* ===== ↑ここまでCSSの変更↑ ===== */

        a.back-link {
            display: inline-block;
            margin-top: 50px;
            margin-bottom: 30px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a.back-link:hover {
            background-color: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
